<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nito ElectrumX Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1923;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #00bcd4);
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2em; color: white; margin-bottom: 8px; }
        .header p { color: rgba(255,255,255,0.85); font-size: 1.1em; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #1a2733;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }
        .stat-box .label { color: #8899aa; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box .value { font-size: 1.8em; font-weight: bold; color: #00e676; margin-top: 5px; }
        .stat-box .value.warn { color: #ffa726; }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .last-check { color: #8899aa; font-size: 0.9em; }
        .refresh-btn {
            background: linear-gradient(135deg, #1a73e8, #00bcd4);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            transition: opacity 0.2s;
        }
        .refresh-btn:hover { opacity: 0.85; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card {
            background: #1a2733;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #555;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card.online { border-left-color: #00e676; }
        .card.offline { border-left-color: #ff5252; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 1.05em; font-weight: 600; }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.online { background: rgba(0,230,118,0.15); color: #00e676; }
        .badge.offline { background: rgba(255,82,82,0.15); color: #ff5252; }
        .card-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-item .info-label { color: #8899aa; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item .info-value { font-size: 0.95em; margin-top: 2px; }
        .error-msg {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(255,82,82,0.1);
            border-radius: 6px;
            color: #ff8a80;
            font-size: 0.85em;
            word-break: break-all;
        }
        .protocol-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .protocol-badge.tcp { background: rgba(255,167,38,0.15); color: #ffa726; }
        .protocol-badge.ssl { background: rgba(0,230,118,0.15); color: #00e676; }
        .protocol-badge.wss { background: rgba(26,115,232,0.15); color: #64b5f6; }
        .footer {
            text-align: center;
            padding: 30px;
            color: #556677;
            font-size: 0.85em;
        }
        .footer a { color: #1a73e8; text-decoration: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.4em; }
            .grid { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Nito ElectrumX Monitor</h1>
        <p>Real-time monitoring of Nito ElectrumX servers</p>
    </div>
    <div class="container">
        <div class="stats-bar" id="stats-bar">
            <div class="stat-box">
                <div class="label">Servers Online</div>
                <div class="value" id="online-count">-</div>
            </div>
            <div class="stat-box">
                <div class="label">Block Height</div>
                <div class="value" id="block-height">-</div>
            </div>
            <div class="stat-box">
                <div class="label">Best Response</div>
                <div class="value" id="best-response">-</div>
            </div>
        </div>
        <div class="controls">
            <div class="last-check" id="last-check">Loading...</div>
            <button class="refresh-btn" id="refresh-btn" onclick="refresh()">Refresh</button>
        </div>
        <div class="grid" id="server-grid"></div>
    </div>
    <div class="footer">
        <p>Nito Network &mdash; <a href="https://nito.network" target="_blank">nito.network</a> &mdash; Auto-refresh every 60s</p>
    </div>

    <script>
        let autoRefresh;

        async function fetchStatus() {
            const resp = await fetch('/api/status');
            return await resp.json();
        }

        function renderServers(data) {
            const grid = document.getElementById('server-grid');
            const servers = data.servers || [];

            // Stats
            const online = servers.filter(s => s.status === 'online').length;
            document.getElementById('online-count').textContent = `${online} / ${servers.length}`;
            document.getElementById('online-count').className = 'value' + (online < servers.length ? ' warn' : '');
            document.getElementById('block-height').textContent = data.block_height ? data.block_height.toLocaleString() : '-';

            const responseTimes = servers.filter(s => s.response_time_ms).map(s => s.response_time_ms);
            const best = responseTimes.length ? Math.min(...responseTimes) : null;
            document.getElementById('best-response').textContent = best ? `${best}ms` : '-';

            document.getElementById('last-check').textContent = data.last_check ? `Last check: ${data.last_check}` : 'Never';

            // Cards
            grid.innerHTML = '';
            servers.forEach(server => {
                const card = document.createElement('div');
                card.className = `card ${server.status}`;

                const protoClass = server.protocol.toLowerCase();

                let infoHTML = `
                    <div class="info-item">
                        <div class="info-label">Host</div>
                        <div class="info-value">${server.host}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Port</div>
                        <div class="info-value">${server.port}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Protocol</div>
                        <div class="info-value"><span class="protocol-badge ${protoClass}">${server.protocol}</span></div>
                    </div>
                `;

                if (server.status === 'online') {
                    infoHTML += `
                        <div class="info-item">
                            <div class="info-label">Version</div>
                            <div class="info-value">${server.version || '-'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Response</div>
                            <div class="info-value">${server.response_time_ms}ms</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Height</div>
                            <div class="info-value">${server.height ? server.height.toLocaleString() : '-'}</div>
                        </div>
                    `;
                    if (server.cert_expires) {
                        infoHTML += `
                            <div class="info-item">
                                <div class="info-label">Cert Expires</div>
                                <div class="info-value">${server.cert_expires}</div>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${server.name}</div>
                        <span class="badge ${server.status}">${server.status}</span>
                    </div>
                    <div class="card-info">${infoHTML}</div>
                    ${server.error ? `<div class="error-msg">${server.error}</div>` : ''}
                `;

                grid.appendChild(card);
            });
        }

        async function refresh() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Checking...';
            try {
                const data = await fetchStatus();
                renderServers(data);
            } catch (e) {
                document.getElementById('last-check').textContent = 'Error fetching status';
            }
            btn.disabled = false;
            btn.textContent = 'Refresh';
        }

        // Initial load + auto refresh
        refresh();
        autoRefresh = setInterval(refresh, 60000);
    </script>
</body>
</html>
