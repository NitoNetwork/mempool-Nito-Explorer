server {
    server_name ${DOMAIN};

    root /usr/share/nginx/html;
    index index.html;

    # Never pin an SPA entry point across deployments. A cached index can
    # reference lazy chunks from the previous release and render a blank page.
    location = / {
        try_files /index.html =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/(?:ar|cs|da|de|es|fa|fr|ko|hr|hi|ne|it|he|ka|lt|hu|mk|nl|ja|nb|pl|pt|ro|ru|sl|fi|sv|th|tr|uk|vi|zh)/index\.html$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Content-hashed bundles are immutable. During a production cutover the
    # previous release's hashed bundles are retained alongside the new ones so
    # already-open tabs can finish lazy navigation safely.
    location ~* \.[0-9a-f]{16,}\.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    }

    # English remains at the root. Public community translations have their
    # own locale-prefixed SPA fallback and use English for missing strings.
    location ~ ^/(?:ar|cs|da|de|es|fa|fr|ko|hr|hi|ne|it|he|ka|lt|hu|mk|nl|ja|nb|pl|pt|ro|ru|sl|fi|sv|th|tr|uk|vi|zh)$ {
        return 302 $uri/;
    }

    location ~ ^/(?<nito_locale>ar|cs|da|de|es|fa|fr|ko|hr|hi|ne|it|he|ka|lt|hu|mk|nl|ja|nb|pl|pt|ro|ru|sl|fi|sv|th|tr|uk|vi|zh)/ {
        try_files $uri $uri/ /$nito_locale/index.html;
        expires 10m;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 10m;
        add_header Cache-Control "public, no-transform";
    }

    location /resources {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    location /resources/config. {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, no-transform";
    }

    location /resources/customize. {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, no-transform";
    }

    location = /en-US {
        return 302 /;
    }

    location ^~ /en-US/ {
        rewrite ^/en-US/(.*)$ /$1 permanent;
    }

    # Mempool backend API (v1)
    location /api/v1/ws {
        proxy_pass http://backend:8999/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://backend:8999/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Compatibility alias for frontend routes that call /api/ directly.
    location /api/ {
        proxy_pass http://backend:8999/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}
