<div class="fee-estimation-wrapper" *ngIf="recommendedFees$ | async as recommendedFees; else loadingFees">
  <div class="d-flex">
    <div class="fee-progress-bar" [style.background]="noPriority">
      <span class="fee-label" i18n="fees-box.no-priority">No Priority</span>
    </div>
    <div class="band-separator fill"></div>
    <div class="fee-progress-bar priority" [style.background]="gradient">
      <span class="fee-label prority" i18n="fees-box.low-priority">Low Priority</span>
      <span class="fee-label prority" i18n="fees-box.medium-priority">Medium Priority</span>
      <span class="fee-label prority" i18n="fees-box.high-priority">High Priority</span>
    </div>
  </div>

  <div class="fee-estimation-container">
    <div class="item">
      <ng-container *ngTemplateOutlet="feeEstimate; context: { fee: recommendedFees.mempoolEmpty ? recommendedFees.minimumFee : recommendedFees.economyFee }"></ng-container>
    </div>
    <div class="band-separator"></div>
    <div class="item">
      <ng-container *ngTemplateOutlet="feeEstimate; context: { fee: recommendedFees.hourFee }"></ng-container>
    </div>
    <div class="item">
      <ng-container *ngTemplateOutlet="feeEstimate; context: { fee: recommendedFees.halfHourFee }"></ng-container>
    </div>
    <div class="item">
      <ng-container *ngTemplateOutlet="feeEstimate; context: { fee: recommendedFees.fastestFee }"></ng-container>
    </div>
  </div>
  <p class="fee-minimum" *ngIf="recommendedFees.targetBlocks">
    <span i18n="@@fees-box.node-minimum">Minimum accepted by this node</span>
    <app-fee-rate [fee]="recommendedFees.minimumFee" rounding="1.0-3"></app-fee-rate>
  </p>
</div>

<ng-template #feeEstimate let-fee="fee">
  <div class="card-text" *ngIf="fee != null; else feeUnavailable">
    <div class="fee-text"><app-fee-rate [fee]="fee" rounding="1.0-3"></app-fee-rate></div>
    <span class="fiat"><app-fiat i18n-ngbTooltip="Transaction fee tooltip" ngbTooltip="Based on average native segwit transaction of 140 vBytes" placement="bottom" [value]="fee * 140"></app-fiat></span>
  </div>
  <ng-template #feeUnavailable>
    <small class="fee-target fee-unavailable" i18n="@@fees-box.estimate-unavailable">Estimate unavailable</small>
  </ng-template>
</ng-template>

<ng-template #loadingFees>
  <p role="status">Core fee estimates unavailable or synchronizing. <span *ngIf="(stateService.orchardActivated$ | async)">Orchard fees use policy virtual size, including proof cost.</span></p>
  <div class="d-flex">
    <div class="fee-progress-bar" [style.background]="noPriority">
      <span class="fee-label" i18n="fees-box.no-priority">No Priority</span>
    </div>
    <div class="band-separator fill"></div>
    <div class="fee-progress-bar priority" [style.background]="gradient">
      <span class="fee-label prority" i18n="fees-box.low-priority">Low Priority</span>
      <span class="fee-label prority" i18n="fees-box.medium-priority">Medium Priority</span>
      <span class="fee-label prority" i18n="fees-box.high-priority">High Priority</span>
    </div>
  </div>
  <div class="fee-estimation-container loading-container">
    <div class="item">
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
    <div class="band-separator"></div>
    <div class="item">
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
    <div class="item">
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
    <div class="item">
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
  </div>
</ng-template>
