<div class="card">
  <div class="card-body more-padding">
    <div class="balance-container" *ngIf="!isLoading; else loading">
      <div class="item">
        <h5 class="card-title" i18n="dashboard.btc-holdings">NITO Holdings</h5>
        <div class="card-text">
          {{ total | nitoAmount }} <span class="symbol" i18n="shared.btc|BTC">NITO</span>
        </div>
        <div class="symbol">
          <app-fiat [value]="(total)"></app-fiat>
        </div>
      </div>
      <div class="item">
        <h5 class="card-title" i18n="dashboard.7d-change">Change (7d)</h5>
        <div class="card-text">
          {{ money.compare(delta7d, 0) > 0 ? '+' : ''}}{{ delta7d | nitoAmount }} <span class="symbol" i18n="shared.btc|BTC">NITO</span>
        </div>
        <div class="symbol">
          <app-fiat [value]="delta7d"></app-fiat>
        </div>
      </div>
      <div class="item">
        <h5 class="card-title" i18n="dashboard.30d-change">Change (30d)</h5>
        <div class="card-text">
          {{ money.compare(delta30d, 0) > 0 ? '+' : ''}}{{ delta30d | nitoAmount }} <span class="symbol" i18n="shared.btc|BTC">NITO</span>
        </div>
        <div class="symbol">
          <app-fiat [value]="delta30d"></app-fiat>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="balance-skeleton">
    <div class="item">
      <h5 class="card-title" i18n="dashboard.btc-holdings">NITO Holdings</h5>
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
    <div class="item">
      <h5 class="card-title" i18n="dashboard.7d-change">Change (7d)</h5>
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
    <div class="item">
      <h5 class="card-title" i18n="dashboard.30d-change">Change (30d)</h5>
      <div class="card-text">
        <div class="skeleton-loader"></div>
        <div class="skeleton-loader"></div>
      </div>
    </div>
  </div>
</ng-template>
